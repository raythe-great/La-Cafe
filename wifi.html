<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18324F">
  <title>WiFi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pesan.css">
</head>
<body class="wifi-page">

  <div class="page-top">
    <a class="m-brand" href="index.html"><i class="fa-solid fa-mug-hot"></i><span data-text="name"></span></a>
    <a class="m-link" href="menu.html"><i class="fa-solid fa-utensils"></i> Menu</a>
  </div>

  <main class="wifi-main">
    <div class="wifi-card">
      <div class="wifi-icon"><i class="fa-solid fa-wifi"></i></div>
      <h1>WiFi Gratis</h1>
      <p class="wifi-note">Nikmati internet cepat selama bersantai di sini.</p>

      <div class="wifi-row">
        <span class="wifi-label">Nama WiFi</span>
        <span class="wifi-value" data-text="wifi_ssid"></span>
      </div>
      <div class="wifi-row" id="passRow">
        <span class="wifi-label">Password</span>
        <span class="wifi-value" data-text="wifi_password"></span>
      </div>

      <div class="wifi-actions">
        <button class="btn btn-primary" id="copyPass" type="button"><i class="fa-regular fa-copy"></i> Salin Password</button>
        <button class="btn btn-ghost" id="copySsid" type="button">Salin Nama WiFi</button>
      </div>

      <!-- QR WiFi: scan dengan kamera HP untuk langsung tersambung -->
      <div class="wifi-qr" id="wifiQr" hidden>
        <div id="qrBox"></div>
        <p>Scan dengan kamera HP untuk langsung tersambung.</p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="qrcode.js"></script>
  <script src="wifi.js"></script>
</body>
</html>
