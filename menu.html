<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18324F">
  <title>Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pesan.css">
</head>
<body class="menu-page">

  <!-- ========== HEADER: nama cafe, nomor meja, pencarian, kategori ========== -->
  <header class="m-header">
    <div class="m-wrap">
      <div class="m-top">
        <a class="m-brand" href="index.html"><i class="fa-solid fa-mug-hot"></i><span data-text="name"></span></a>
        <div class="m-right">
          <a class="m-link" href="wifi.html"><i class="fa-solid fa-wifi"></i> WiFi</a>
          <span class="m-table" id="tableBadge" hidden></span>
        </div>
      </div>

      <div class="m-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="search" placeholder="Cari menu..." autocomplete="off" aria-label="Cari menu">
      </div>

      <div class="m-cats" id="cats"></div>
    </div>
  </header>

  <!-- ========== DAFTAR MENU (dibuat oleh menu.js) ========== -->
  <main class="m-list" id="list"></main>

  <!-- ========== BAR KERANJANG (muncul setelah ada pesanan) ========== -->
  <button class="cart-bar" id="cartBar" type="button" hidden>
    <span class="cart-count" id="cartCount">0</span>
    <span class="lbl">Lihat Pesanan</span>
    <strong id="cartTotal"></strong>
  </button>

  <!-- ========== LEMBAR PESANAN ========== -->
  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Pesanan kamu" aria-hidden="true">
    <div class="sheet-head">
      <h2>Pesanan Kamu</h2>
      <button id="closeSheet" type="button" aria-label="Tutup">&times;</button>
    </div>

    <div class="sheet-body">
      <ul class="cart-list" id="cartList"></ul>

      <div class="form-row">
        <label for="tableInput">Nomor meja</label>
        <input id="tableInput" type="text" inputmode="numeric" maxlength="10" placeholder="Contoh: 5" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="nameInput">Nama pemesan</label>
        <input id="nameInput" type="text" maxlength="40" placeholder="Nama kamu" autocomplete="name">
      </div>
      <div class="form-row">
        <label for="noteInput">Catatan (opsional)</label>
        <textarea id="noteInput" rows="2" maxlength="200" placeholder="Contoh: kurang manis, tanpa es"></textarea>
      </div>
    </div>

    <div class="sheet-foot">
      <div class="sheet-total"><span>Total</span><strong id="sheetTotal"></strong></div>
      <button class="btn btn-primary btn-block" id="sendOrder" type="button">
        <i class="fa-brands fa-whatsapp"></i> Kirim Pesanan via WhatsApp
      </button>
      <button class="btn btn-outline btn-block" id="goPayment" type="button">
        <i class="fa-solid fa-wallet"></i> Demo Pembayaran
      </button>
      <button class="link-btn" id="clearCart" type="button">Kosongkan pesanan</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="menu.js"></script>
</body>
</html>
